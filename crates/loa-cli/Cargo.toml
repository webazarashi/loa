[package]
name = "loa-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true

[[bin]]
name = "loa"
path = "src/main.rs"

[features]
default = ["tls"]
tls = ["loa-core/tls"]
test-hooks = ["loa-core/test-hooks"]

[dependencies]
loa-core = { workspace = true, default-features = false }
loa-ui.workspace = true
clap.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
