id: oa.list
version: 1
min_loa_version: "0.1.0"
operation: oa.list
status: provisional
outputs:
  accounts: { type: list }
steps:
  - goto: "https://manager.line.biz/"
  - require_login: true
  - wait_text: "アカウント"
  - read_list: { link_pattern: "/account/(?<id>@[A-Za-z0-9._-]+)/?$", into: accounts }
