id: oa.list
version: 1
min_loa_version: "0.1.0"
operation: oa.list
status: verified
outputs:
  accounts: { type: list }
steps:
  - goto: "https://manager.line.biz/"
  - require_login: true
  # 見出し「アカウントリスト」は一覧より先に出る。件数付きの「アカウント(8)」は読み込み後に出る
  - wait_text: "アカウント("
  - read_list: { link_pattern: "/account/(?<id>@[A-Za-z0-9._-]+)/?$", into: accounts }
