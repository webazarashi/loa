id: oa.update.response
version: 1
min_loa_version: "0.1.0"
operation: oa.update.response
status: provisional
inputs:
  oa_id: { type: string, required: true }
  name: { type: string, required: true }
  chat: { type: string, required: true }
  webhook: { type: string, required: true }
  auto_reply: { type: string, required: true }
steps:
  - goto: "https://manager.line.biz/account/{{oa_id}}/setting/response"
  - require_login: true
  - confirm_target: { css: "header", pattern: "(@[A-Za-z0-9._-]+)", equals: "{{oa_id}}" }
  - assert: { text_contains: "{{name}}" }
  - check: { role: switch, name: "チャット", checked: "{{chat}}" }
  - check: { role: switch, name: "Webhook", checked: "{{webhook}}" }
  - check: { role: switch, name: "応答メッセージ", checked: "{{auto_reply}}" }
