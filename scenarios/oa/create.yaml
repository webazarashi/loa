id: oa.create
version: 2
min_loa_version: "0.1.0"
operation: oa.create
status: provisional
description: 公式アカウントを開設する。SMS認証や画像認証（reCAPTCHA）が出たら人の操作を待つ
inputs:
  name: { type: string, required: true }
  category: { type: string, default: "" }
  subcategory: { type: string, default: "" }
  company: { type: string, default: "" }
outputs:
  oa_id: { type: string }
steps:
  - goto: "https://entry.line.biz/form/entry/unverified"
  - require_login: true
  - if_exists:
      text: "認証番号"
      then:
        - human:
            message: "ブラウザでSMS認証を完了してください"
            until: { exists: { label: "アカウント名" } }
  - wait_for: { label: "アカウント名" }
  - fill: { label: "アカウント名", value: "{{name}}" }
  - if_set:
      var: company
      then:
        - fill: { label: "会社・事業者名", value: "{{company}}" }
  - if_set:
      var: category
      then:
        - select: { label: "大業種", value: "{{category}}" }
  - if_set:
      var: subcategory
      then:
        - select: { label: "小業種", value: "{{subcategory}}" }
  - human:
      message: "入力内容を確認し、残りの必須項目（運用目的など）があれば入力して「確認」を押してください"
      until: { exists: { role: button, name: "完了" } }
  - agree_terms:
      terms_id: "line-official-account-terms"
      title: "LINE公式アカウント利用規約"
      role: button
      name: "完了"
      click: true
      link: "https://terms2.line.me/official_account_terms_jp?lang=ja"
  # 2026-11-24 確認: 「完了」のあと reCAPTCHA の画像認証が出ることがある。出なければ完了画面
  # （/form/entry/unverified/complete）がすぐ開く。確認画面のメールアドレスにも「@」があるので、
  # 作成後にしか出ない見出しで待つ
  - if_exists:
      text: "LINE公式アカウントが作成されました。"
      wait_ms: 10000
      else:
        - human:
            message: "ブラウザに画像認証（reCAPTCHA）が出ていたら、画面の指示どおりに完了してください"
            until: { url_matches: "**/form/entry/unverified/complete**" }
  - wait_text: "LINE公式アカウントが作成されました"
  # ベーシックIDは完了画面の表のセル（例 @247peamj）。メールアドレスの「@」は拾わない
  - read: { css: "main", pattern: "(?:^|[^A-Za-z0-9._%+-])(@[0-9a-z][0-9a-z._-]*)", into: oa_id }
